<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#635bff">
<title>Little Notes</title>
<style>
:root{--bg:#f5f6fb;--panel:#fff;--text:#202338;--muted:#72768b;--line:#e7e8f0;--accent:#635bff;--soft:#eeedff;--shadow:0 10px 35px #2023380b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}body.dark{--bg:#141520;--panel:#202130;--text:#f4f4ff;--muted:#a6a8bf;--line:#343548;--soft:#302d52;--shadow:0 10px 35px #0002}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:hover{filter:brightness(.97)}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-size:23px;font-weight:800}.logo{background:var(--accent);color:white;border-radius:12px;padding:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.sidebar h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px}.sidebtn{width:100%;display:flex;justify-content:space-between;text-align:start;margin:3px 0;border-color:transparent}.sidebtn.active{background:var(--soft);color:var(--accent)}.subjects{display:grid;gap:4px}.mainhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:160px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.note{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);min-height:170px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative}.note:hover{border-color:var(--accent)}.note h3{margin:0;font-size:17px}.note p{color:var(--muted);margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:95px;overflow:hidden}.tag{display:inline-block;font-size:12px;border-radius:20px;padding:4px 9px;background:var(--soft);color:var(--accent);width:max-content}.notefoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.star{border:0;padding:0;background:transparent;font-size:20px}.empty{text-align:center;color:var(--muted);padding:55px 12px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}.editor{width:min(850px,100%);max-height:95vh;overflow:auto;background:var(--panel);border-radius:18px;padding:18px}.editorhead{display:flex;gap:8px;justify-content:space-between;align-items:center}.editor input,.editor select,.editor textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin:5px 0 12px}.editor textarea{min-height:220px;resize:vertical}.toolbar{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.toolbar button{padding:6px 9px}.editor label{font-size:12px;color:var(--muted)}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editorbuttons{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.checkline{display:flex;gap:8px;align-items:center;margin:8px 0}.checkline input{width:auto;margin:0}.muted{color:var(--muted);font-size:12px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;display:none;z-index:10}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sidebar h3{grid-column:1/-1;margin:7px 0}.subjects{grid-column:1/-1;grid-template-columns:1fr 1fr}.app{padding:12px}.editorgrid{grid-template-columns:1fr}.brand{font-size:20px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><span class="logo">✎</span> Little Notes</div><div class="actions"><select id="uiLang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="ku">کوردی</option></select><button id="themeBtn" title="Toggle dark mode">☾</button><button id="exportBtn">Export backup</button><button id="importBtn">Import</button><input type="file" id="importFile" accept="application/json" hidden></div></header>
<div class="layout"><aside class="panel sidebar"><button class="sidebtn active" data-filter="all">🗂 All notes <span id="allCount">0</span></button><button class="sidebtn" data-filter="fav">⭐ Favorites</button><button class="sidebtn" data-filter="todo">☑ To-do</button><h3>Subjects</h3><div class="subjects" id="subjectList"></div><h3>Quick tip</h3><div class="muted">Your notes are saved on this device. Export a backup so you can move them to another device.</div></aside>
<main class="panel"><div class="mainhead"><input class="search" id="search" placeholder="Search notes…"><button class="primary" id="newBtn">＋ New note</button></div><div id="notes" class="notes"></div><div id="empty" class="empty">✎<h3>No notes yet</h3><div>Create your first note to get started.</div></div></main></div></div>
<div class="modal" id="modal"><section class="editor"><div class="editorhead"><h2 id="editorTitle">New note</h2><button id="closeBtn">✕</button></div><label for="title">Title</label><input id="title" placeholder="Note title"><div class="editorgrid"><div><label for="subject">Subject</label><select id="subject"><option>General</option><option>کوردی</option><option>عەرەبی</option><option>ئینگلیزی</option><option>بیرکاری</option><option>جەگرافیا</option><option>مێژوو</option><option>ئابووری</option><option>فەلسەفە</option></select></div><div><label for="tagInput">Colored tag</label><input id="tagInput" placeholder="e.g. Exam revision"></div></div><div class="editorgrid"><div><label for="chapter">Chapter</label><input id="chapter" placeholder="Chapter name"></div><div><label for="lesson">Lesson</label><input id="lesson" placeholder="Lesson name"></div></div><label>Formatting</label><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">• Bullets</button><button data-cmd="insertOrderedList">1. Numbered</button><button data-cmd="formatBlock" data-value="H2">Heading</button><button data-cmd="formatBlock" data-value="P">Normal</button><button data-cmd="hiliteColor" data-value="#fff19a">🟨 Highlight</button><input type="color" id="textColor" title="Text color" value="#635bff" style="width:38px;padding:2px;margin:0;height:34px"></div><label for="bodyText">Note / lesson content</label><div id="bodyText" contenteditable="true" role="textbox" aria-multiline="true" style="min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--text);outline:none;overflow-wrap:anywhere" data-placeholder="Write your note here…"></div><div class="checkline"><input type="checkbox" id="isTodo"><label for="isTodo">This is a to-do note</label><input type="checkbox" id="isFav"><label for="isFav">Favorite ⭐</label></div><div class="editorbuttons"><button id="deleteBtn">Delete</button><div style="display:flex;gap:8px"><button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save note</button></div></div></section></div><div id="toast"></div>
<script>
const SUBJECTS=['General','کوردی','عەرەبی','ئینگلیزی','بیرکاری','جەگرافیا','مێژوو','ئابووری','فەلسەفە'];const $=id=>document.getElementById(id);let notes=[],editing=null,filter='all';try{notes=JSON.parse(localStorage.getItem('littleNotes')||'[]')}catch(e){notes=[]}const persist=()=>{localStorage.setItem('littleNotes',JSON.stringify(notes));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function render(){const list=$('notes');list.innerHTML='';const q=$('search').value.toLowerCase();const visible=notes.filter(n=>{let ok=filter==='all'||(filter==='fav'&&n.fav)||(filter==='todo'&&n.todo)||(filter.startsWith('sub:')&&n.subject===filter.slice(4));return ok&&[n.title,n.body,n.subject,n.tag,n.chapter,n.lesson].join(' ').toLowerCase().includes(q)});$('allCount').textContent=notes.length;$('empty').style.display=visible.length?'none':'block';visible.sort((a,b)=>b.updated-a.updated).forEach(n=>{const card=document.createElement('article');card.className='note';card.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><span class="tag">${esc(n.subject||'General')}</span><button class="star" aria-label="Favorite">${n.fav?'★':'☆'}</button></div><h3>${esc(n.title||'Untitled note')}</h3>${n.chapter||n.lesson?`<div class="muted">${esc([n.chapter,n.lesson].filter(Boolean).join(' › '))}</div>`:''}<p>${n.todo?'☑ To-do · ':''}${esc((n.body||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim())}</p>${n.tag?`<span class="tag" style="background:${esc(n.color||'#eeedff')};color:#333">${esc(n.tag)}</span>`:''}<div class="notefoot"><span>${new Date(n.updated).toLocaleDateString()}</span><span>✎ Edit</span></div>`;card.querySelector('.star').onclick=e=>{e.stopPropagation();n.fav=!n.fav;persist()};card.onclick=()=>openEditor(n.id);list.appendChild(card)});$('subjectList').innerHTML='';SUBJECTS.slice(1).forEach(s=>{const b=document.createElement('button');b.className='sidebtn '+(filter==='sub:'+s?'active':'');b.textContent=s;b.onclick=()=>{filter='sub:'+s;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));render()};$('subjectList').appendChild(b)});document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function openEditor(id=null){editing=id;const n=notes.find(x=>x.id===id)||{};$('editorTitle').textContent=id?'Edit note':'New note';$('title').value=n.title||'';$('subject').value=n.subject||'General';$('tagInput').value=n.tag||'';$('chapter').value=n.chapter||'';$('lesson').value=n.lesson||'';$('bodyText').innerHTML=n.body||'';$('isTodo').checked=!!n.todo;$('isFav').checked=!!n.fav;$('deleteBtn').style.visibility=id?'visible':'hidden';$('modal').classList.add('open')}
function closeEditor(){$('modal').classList.remove('open')}function save(){const title=$('title').value.trim(),body=$('bodyText').innerHTML.trim();if(!title&&!body){toast('Write a title or some content first.');return}const old=notes.find(n=>n.id===editing);const n={id:editing||String(Date.now()),title,body,subject:$('subject').value,tag:$('tagInput').value.trim(),chapter:$('chapter').value.trim(),lesson:$('lesson').value.trim(),todo:$('isTodo').checked,fav:$('isFav').checked,updated:Date.now(),color:'#eeedff'};if(old)Object.assign(old,n);else notes.push(n);persist();closeEditor();toast('Note saved on this device')}
$('newBtn').onclick=()=>openEditor();$('closeBtn').onclick=$('cancelBtn').onclick=closeEditor;$('saveBtn').onclick=save;$('deleteBtn').onclick=()=>{if(editing&&confirm('Delete this note?')){notes=notes.filter(n=>n.id!==editing);persist();closeEditor();toast('Note deleted')}};$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('bodyText').focus()});$('textColor').oninput=e=>{document.execCommand('foreColor',false,e.target.value);$('bodyText').focus()};$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('littleNotesDark',document.body.classList.contains('dark'))};if(localStorage.getItem('littleNotesDark')==='true')document.body.classList.add('dark');$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='little-notes-backup.json';a.click();URL.revokeObjectURL(url)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text());if(!Array.isArray(incoming))throw Error();if(confirm('Import backup? Imported notes will be added to existing notes.')){notes.push(...incoming.map(n=>({...n,id:String(Date.now())+Math.random()})));persist();toast('Backup imported')}}catch(err){toast('Could not read that backup file')}e.target.value=''};$('uiLang').onchange=e=>{const l=e.target.value;document.documentElement.lang=l;document.document.documentElement.dir=l==='ar'||l==='ku'?'rtl':'ltr';toast(l==='ku'?'زمانی ڕووکار گۆڕا':l==='ar'?'تم تغيير اتجاه الواجهة':'Interface direction changed')};render();
</script></body></html>
